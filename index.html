<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Giriş · Ricâl Tenkidi</title>
<style>
  :root { --zemin: #f6f1ea; --kart: #fff; --yazi: #2b2118; --soluk: #6b5d50; --vurgu: #7a3b12; --hata: #a4161a; --cizgi: #e2d8cc; }
  @media (prefers-color-scheme: dark) { :root { --zemin: #1d1915; --kart: #2a241e; --yazi: #f1e9df; --soluk: #b7a998; --vurgu: #e0a173; --hata: #ff8a80; --cizgi: #433a31; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--zemin); color: var(--yazi);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--kart); border: 1px solid var(--cizgi); border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.3rem; color: var(--vurgu); }
  p { margin: 0 0 20px; color: var(--soluk); font-size: .92rem; }
  label { display: block; font-size: .9rem; margin-bottom: 6px; }
  input[type=password] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--cizgi); border-radius: 8px; background: var(--zemin); color: var(--yazi); }
  .hatirla { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; font-size: .9rem; color: var(--soluk); }
  button { width: 100%; padding: 10px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: var(--vurgu); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #durum { min-height: 1.5em; margin: 14px 0 0; font-size: .9rem; }
  #durum.hata { color: var(--hata); }
</style>
</head>
<body>
<form id="giris" autocomplete="on">
  <h1>Ricâl Tenkidi</h1>
  <p>Bu site parola ile korunmaktadır. İçerik tarayıcınızda çözülür.</p>
  <input type="text" name="username" value="rical" autocomplete="username" hidden>
  <label for="parola">Parola</label>
  <input id="parola" type="password" autocomplete="current-password" required autofocus>
  <label class="hatirla"><input id="kalici" type="checkbox"> Bu cihazda 30 gün açık kalsın (aksi hâlde 12 saat)</label>
  <button id="dugme" type="submit">Giriş</button>
  <div id="durum" role="status"></div>
</form>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const durum = (s, hata) => { $('durum').textContent = s; $('durum').className = hata ? 'hata' : ''; };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle) {
    durum('Bu tarayıcı (veya gizli pencere) gerekli özellikleri desteklemiyor. Güncel Chrome, Edge, Safari ya da normal pencerede Firefox kullanın.', true);
    $('dugme').disabled = true;
    return;
  }
  const kayit = navigator.serviceWorker.register('sw.js');

  $('giris').addEventListener('submit', async e => {
    e.preventDefault();
    $('dugme').disabled = true;
    durum('Parola doğrulanıyor…');
    try {
      const kasa = await (await fetch('kasa.json', { cache: 'no-cache' })).json();
      const temel = await crypto.subtle.importKey('raw', new TextEncoder().encode($('parola').value), 'PBKDF2', false, ['deriveBits']);
      const ham = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(kasa.tuz), iterations: kasa.tekrar }, temel, 512);
      const aes = await crypto.subtle.importKey('raw', ham.slice(0, 32), 'AES-GCM', false, ['decrypt']);
      const d = b64(kasa.dogrulama);
      try {
        await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.subarray(0, 12), additionalData: new TextEncoder().encode('dogrulama') }, aes, d.subarray(12));
      } catch {
        durum('Parola hatalı.', true);
        $('dugme').disabled = false;
        $('parola').select();
        return;
      }
      await kayit;
      const reg = await navigator.serviceWorker.ready;
      const kanal = new MessageChannel();
      const yanit = new Promise(ok => { kanal.port1.onmessage = m => ok(m.data); });
      reg.active.postMessage({ tur: 'giris', ham, kalici: $('kalici').checked }, [kanal.port2]);
      const y = await yanit;
      if (!y || !y.ok) throw new Error(y && y.hata || 'anahtar kaydedilemedi');
      durum('Açılıyor…');
      location.reload();
    } catch (h) {
      durum('Giriş tamamlanamadı: ' + (h.message || h), true);
      $('dugme').disabled = false;
    }
  });
})();
</script>
</body>
</html>
